<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>효니의 책장</title>
<meta name="description" content="@hyonnie_books와 블로그에 쓴 책 이야기를 모은 책장">
<meta name="theme-color" content="#f3f4f2">
<script>try { var ed = localStorage.getItem('shelf-edition'); if (ed) document.documentElement.dataset.edition = ed; } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header class="cover">
    <div>
      <h1>효니의 책장</h1>
      <p id="lede">책장을 펴는 중</p>
    </div>
    <div class="who" id="who"></div>
  </header>
  <aside class="today" id="today" aria-label="오늘의 문장" hidden></aside>
  <div class="topnav" id="topnav">
    <div class="tabs-line">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-shelf" aria-selected="true" aria-controls="view-shelf">읽은 책</button>
        <button class="tab owner-only" role="tab" id="tab-library" aria-selected="false" aria-controls="view-library" hidden>내 서재</button>
        <button class="tab" role="tab" id="tab-posts" aria-selected="false" aria-controls="view-posts">서평</button>
        <button class="tab" role="tab" id="tab-recap" aria-selected="false" aria-controls="view-recap">돌아보기</button>
      </div>
      <button class="copy" id="editionBtn" type="button">색 에디션</button>
    </div>
    <nav class="row jump" id="jump" aria-label="바로 가기" hidden></nav>
  </div>
  <section id="view-shelf" role="tabpanel" aria-labelledby="tab-shelf">
    <div class="filters folded">
      <div class="row" id="kinds" role="group" aria-label="종류"></div>
      <div class="fold-bar">
        <button class="chip fold-btn" id="foldFilters" type="button" aria-expanded="false" aria-controls="filterPanel"><span id="foldLabel">주제·순서</span></button>
        <button class="chip fold-btn owner-only" id="foldTools" type="button" aria-expanded="false" aria-controls="toolsPanel" hidden>관리</button>
      </div>
      <div class="fold-panel" id="filterPanel" hidden>
      <div class="row" id="themes" role="group" aria-label="주제"></div>
      <div class="row" id="shelfSort" role="group" aria-label="책 순서"></div>
      <div class="row" role="group" aria-label="더 고르기">
        <button class="chip" id="onlyIg" type="button" aria-pressed="false">서평이 있는 책만</button>
        <button class="chip owner-only" id="showUnknown" type="button" aria-pressed="false" hidden>제목 확인 안 된 책 보이기</button>
        <button class="chip owner-only" id="onlyMe" type="button" aria-pressed="false" hidden>나만 보기</button>
      </div>
      </div>
      <div class="fold-panel fold-tools" id="toolsPanel" hidden><button class="copy" id="fixDups" type="button">겹치는 책 고치기</button> <button class="copy" id="memoOverlap" type="button">인스타와 겹치는 메모</button> <button class="copy" id="memoBin" type="button" hidden>보관한 메모</button></div>
    </div>
    <div class="bar">
      <input class="search" id="q" type="search" placeholder="제목, 저자, 서평 내용 찾기" aria-label="찾기">
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div id="shelves"></div>
    <p class="note" id="foot"></p>
  </section>
  <section id="view-library" role="tabpanel" aria-labelledby="tab-library" hidden>
    <div class="filters">
      <div class="row" id="libKinds" role="group" aria-label="서재 보기"></div>
      <div><button class="copy" id="addMany" type="button">+ 여러 권 한꺼번에 꽂기</button></div>
    </div>
    <div class="bar">
      <input class="search" id="lq" type="search" placeholder="제목, 저자, 빌린 사람 찾기" aria-label="서재에서 찾기">
      <span class="count" id="lcount" aria-live="polite"></span>
    </div>
    <div id="cases"></div>
    <div id="ledger"></div>
    <p class="note">내 서재와 빌린 기록은 로그인한 나에게만 보여요.</p>
  </section>
  <section id="view-posts" role="tabpanel" aria-labelledby="tab-posts" hidden>
    <div class="filters">
      <div class="row" id="postKinds" role="group" aria-label="글 종류"></div>
      <div class="row" id="postSort" role="group" aria-label="글 순서"></div>
      <div class="owner-only" hidden><button class="copy" id="addPost" type="button">+ 인스타 글 추가</button></div>
    </div>
    <div class="bar">
      <input class="search" id="pq" type="search" placeholder="서평·블로그 글 찾기" aria-label="서평 찾기">
      <span class="count" id="pcount" aria-live="polite"></span>
    </div>
    <div id="posts"></div>
    <div id="postsMore" class="more" hidden></div>
  </section>
  <section id="view-recap" role="tabpanel" aria-labelledby="tab-recap" hidden><div class="recap" id="recap"></div></section>
</div>

<button class="fab owner-only" id="addBook" type="button" hidden>+ 책 추가</button>
<button class="totop" id="toTop" type="button">↑ 맨 위로</button>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="tome" id="sheet-body"></div></dialog>
<dialog id="form" aria-labelledby="form-title"><form class="sheet" id="form-body" method="dialog"></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
